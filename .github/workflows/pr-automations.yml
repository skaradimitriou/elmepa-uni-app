name: Auto Label PR Based on Branch Name

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  pr-automations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Add assignee to PR
      - name: Auto assign PR to PR creator
        if: startsWith(github.head_ref, 'renovate/') == false
        run: gh pr edit "$PR_URL" --add-assignee "$GITHUB_ACTOR"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      ## Apply labels based on branch name
      - name: Apply labels based on branch name
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const branchName = pr.head.ref;  // Get the PR's branch name
            const labelsToAdd = [];

            // Apply labels based on branch name
            if (branchName.startsWith("feature/") || branchName.startsWith("enhancement/")) {
              labelsToAdd.push("enhancement");
            } else if (branchName.startsWith("fix/") || branchName.startsWith("bugfix/") || branchName.startsWith("bug/")) {
              labelsToAdd.push("bugfix");
            } else if (branchName.startsWith("platform/")) {
              labelsToAdd.push("platform");
            }

            // Apply labels if any are found
            if (labelsToAdd.length > 0) {
              github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: labelsToAdd
              });
            }

      ## Set up Java version
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      ## Grant execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Decode google services json file
      - name: Decode google-services.json
        run: |
          mkdir -p app
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # Setup gradle configurations
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      ## Build
      - name: Build with Gradle
        run: ./gradlew build

      # Android Build - Generate APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Set up Node.js (required for Firebase CLI)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Install Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Decode and save Firebase service account JSON from GitHub secrets
      - name: Decode Firebase service account
        run: |
          echo "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON}}" | base64 --decode > $HOME/firebase-service-account.json

      # Set GOOGLE_APPLICATION_CREDENTIALS environment variable
      - name: Set environment variable for Google credentials
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json" >> $GITHUB_ENV

      # Distribute APK to Firebase App Distribution
      - name: Distribute APK to Firebase
        run: |
          firebase appdistribution:distribute ./app/build/outputs/apk/debug/app-debug.apk \
            --app ${{ secrets.FIREBASE_APP_ID }} \
            --groups "admins" \
            --release-notes "Release notes: Build from branch ${GITHUB_REF##*/}"
